services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OFFLINE=${OFFLINE:-0}
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./data:/app/data
      - ./offline_fixtures:/app/offline_fixtures
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend --timeout-graceful-shutdown 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
