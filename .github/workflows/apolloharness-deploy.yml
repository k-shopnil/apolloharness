name: Deploy Apollo Harness to Firebase

# Builds the prototype app from frontend/ (Issue #8 §4.3) and deploys it to the
# apolloharness Hosting site only. The team website (chhayanautical) deploys
# from the team-website branch and is not touched by this workflow.
# This workflow is currently disabled in the Actions tab; re-enable it once the
# frontend PR is merged and the PR checks are green.

on:
  push:
    branches:
      - main

concurrency:
  group: apolloharness-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check for frontend app
        id: check_package
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
            echo "::notice::No frontend/package.json on main yet; nothing to deploy."
          fi

      - name: Set up Node.js
        if: steps.check_package.outputs.has_package == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check_package.outputs.has_package == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build project
        if: steps.check_package.outputs.has_package == 'true'
        working-directory: frontend
        run: npm run build

      - name: Deploy to Apollo Harness Hosting Site
        if: steps.check_package.outputs.has_package == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHHAYANAUTICAL_37871 }}'
          channelId: live
          projectId: chhayanautical-37871
          target: apolloharness
