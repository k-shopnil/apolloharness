# PR checks for HarnessApollo (Issue #8 §8.2).
# After this lands on main, mark these three jobs as required status checks
# in Settings -> Branches -> main: python-tests, frontend-build, data-guard.
# python-tests downloads ~730 MB of Git LFS data, so it only runs when science
# code or data changes (see the `changes` job); otherwise it is skipped.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the heavy science job needs to run. We filter here, not
  # with a workflow-level `paths:` filter, because a required check that never
  # starts stays "pending" and blocks the merge; a skipped job counts as passed.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      science: ${{ steps.filter.outputs.science }}
    steps:
      - name: Checkout (history only, no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Did science code or data change?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main and manual runs always run the full science suite.
          if [ "$EVENT" != "pull_request" ]; then
            echo "science=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(src/|backend/|data/|demo_fixtures/|offline_fixtures/|tests/|requirements[^/]*\.txt$|pytest\.ini$|\.github/workflows/pr-checks\.yml$)'; then
            echo "science=true" >> "$GITHUB_OUTPUT"
          else
            echo "science=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No science code or data changed; skipping the LFS download and pytest."
          fi

  python-tests:
    name: python-tests
    needs: changes
    if: needs.changes.outputs.science == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (without LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      # LFS bandwidth is metered (~740 MB of NASA products), so cache the
      # objects keyed on the exact set of LFS pointers in this commit.
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      - name: Check LFS files are real data, not pointers
        run: |
          missing=$(git lfs ls-files | grep ' - ' || true)
          if [ -n "$missing" ]; then
            echo "::error::These LFS files are still pointer files:"
            echo "$missing"
            exit 1
          fi
          echo "All $(git lfs ls-files | wc -l) LFS files present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt pytest
          fi

      - name: Syntax check
        run: |
          python -m compileall -q src
          if [ -d backend ]; then python -m compileall -q backend; fi

      - name: Run tests
        run: python -m pytest -q tests

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # Passes as a no-op until the app lives in frontend/ (Issue #8 §4.3).
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package.json yet; skipping the frontend build."
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type-check and build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  data-guard:
    name: data-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # Issue #8 quality gate 1: zero invented data. tests/ is excluded on
      # purpose, because tests assert that these IDs are absent.
      - name: Block known mock missions and invented defaults
        run: |
          paths=""
          for p in backend frontend/src demo_fixtures offline_fixtures data/missions.json; do
            [ -e "$p" ] && paths="$paths $p"
          done
          [ -z "$paths" ] && { echo "Nothing to scan."; exit 0; }
          pattern="\"(ls-1|xl-1|mock-m[0-9a-z-]*)\"|'(ls-1|xl-1)'|PRIME-2|\"?semi_major_km\"?: *5\.0"
          hits=$(grep -rnE "$pattern" $paths || true)
          if [ -n "$hits" ]; then
            echo "::error::Mock missions or invented defaults found (Issue #8 §3, gate 1):"
            echo "$hits"
            exit 1
          fi
          echo "No mock IDs or invented defaults in:$paths"

      - name: Offline fixture matches the canonical catalog
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          def ids(path):
              d = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              items = d if isinstance(d, list) else d.get("missions", [])
              return {m["id"] for m in items}
          fixture = next((p for p in ("offline_fixtures/missions.json", "demo_fixtures/missions.json")
                          if pathlib.Path(p).is_file()), None)
          if fixture is None:
              print("::error::No offline fixture catalog found")
              sys.exit(1)

          a, b = ids("data/missions.json"), ids(fixture)
          if a != b:
              print(f"::error::{fixture} IDs differ from data/missions.json")
              print("only in catalog:", sorted(a - b))
              print("only in fixture:", sorted(b - a))
              sys.exit(1)
          print(f"{len(a)} canonical IDs match.")
          PY
