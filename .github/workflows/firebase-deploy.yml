name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - team-website

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check package manager
        id: pkg_mgr
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi

      - name: Install pnpm
        if: steps.pkg_mgr.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pkg_mgr.outputs.manager }}

      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg_mgr.outputs.manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: |
          if [ "${{ steps.pkg_mgr.outputs.manager }}" = "pnpm" ]; then
            pnpm run build
          else
            npm run build
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHHAYANAUTICAL_37871 }}'
          channelId: live
          projectId: chhayanautical-37871

