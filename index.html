<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden bg-black text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollo Harness(Prototype) </title>
  <link rel="icon" type="image/png" href="/harness_badge_color.png">
  <link rel="apple-touch-icon" href="/harness_badge_color.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CesiumJS Official Engine -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script>
    window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/';
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              black: '#000000',
              panel: '#09090B',
              card: '#121214',
              border: '#27272A',
              orange: '#FF4D00',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Precision custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 2px;
    }

    /* Hide Cesium bottom attribution/credits */
    .cesium-viewer-bottom {
      display: none !important;
    }
  </style>
</head>
<body class="h-full overflow-hidden bg-black text-white selection:bg-[#FF4D00] selection:text-black">
  <div id="root" class="h-full overflow-hidden"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
